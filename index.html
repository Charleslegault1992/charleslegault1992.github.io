<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V4S1ZRKD3N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-V4S1ZRKD3N");
    </script>
    <!-- <script src="./js/main.js" defer></script> -->
    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="/src/css/style.css" />
    <title>No name yet Online</title>
  </head>
  <body>
    <div id="game-welcome" class="game-welcome-overlay">
      <button id="game-welcome-play" class="game-welcome-play-button" type="button">PLAY</button>
      <div class="game-welcome-language" role="group" aria-label="Language">
        <button class="game-welcome-language-button" type="button" data-game-language="en">EN</button>
        <button class="game-welcome-language-button" type="button" data-game-language="fr">FR</button>
      </div>
    </div>
    <div id="character-selector" class="character-selector-overlay" hidden></div>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <section class="navbar-gauche">
            <a class="navbar-brand" href="#"
              ><img src="/images/icone.png" alt="Logo" class="d-inline-block align-text-top logo" />No name yet
              Online</a
            >
          </section>
          <section class="navbar-droite">
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#" data-game-text="home">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#" data-game-text="game">Game</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#" data-game-text="account">Account</a>
                </li>
              </ul>
            </div>
          </section>
        </div>
      </nav>
    </header>
    <main>
      <div class="boite-principal" id="boite-principal">
        <section class="entete-jeux">
          <div class="boite-titre">
            <h3 class="titre">No name yet Online</h3>
          </div>
        </section>
        <section class="boite-jeux" id="boite-jeux">
          <section class="jeux-gauche jeux-panneau">
            <div id="player-minimap" class="boite-panneau minimap-panel">
              <div class="minimap-header">
                <div class="boite-jeux-titre" data-game-text="minimap">Minimap</div>
                <div class="minimap-controls">
                  <button id="minimap-zoom-out" class="minimap-control-button" type="button" data-game-title="zoomOut">-</button>
                  <span id="minimap-zoom-level" class="minimap-zoom-level">100%</span>
                  <button id="minimap-zoom-in" class="minimap-control-button" type="button" data-game-title="zoomIn">+</button>
                  <button id="minimap-center" class="minimap-control-button" type="button" data-game-title="centerMinimap">&#9678;</button>
                </div>
              </div>
              <div class="separateur-panneau"></div>
              <div class="minimap-viewport">
                <canvas id="minimap-canvas" width="210" height="150"></canvas>
                <div class="minimap-floor-controls">
                  <button id="minimap-floor-up" class="minimap-floor-button" type="button" data-game-title="floorUp">&#8593;</button>
                  <span id="minimap-floor-level" class="minimap-floor-level">Z 0</span>
                  <button id="minimap-floor-down" class="minimap-floor-button" type="button" data-game-title="floorDown">&#8595;</button>
                </div>
              </div>
            </div>
            <div id="player-stats" class="boite-panneau"></div>
          </section>

          <div class="boite-jeux-inner">
            <section class="jeux" id="game" tabindex="-1">
              <div id="fps-counter">FPS: 0</div>
              <div id="game-status-message" class="game-status-message"></div>
              <div id="player-quests" class="boite-panneau quest-window" hidden></div>
              <div id="game-options" class="boite-panneau options-window" hidden></div>
              <canvas id="light-canvas"></canvas>
              <div id="player">
                <div class="player-floating-text-layer"></div>
                <div class="php-bar">
                  <div class="php-red"></div>
                </div>
              </div>
            </section>
          </div>

          <section class="jeux-droite jeux-panneau">
            <div id="player-inventory" class="boite-panneau"></div>
            <div id="player-containers" class="container-dock-wrapper"></div>
          </section>
        </section>
        <section class="boite-chat" id="boite-chat">
          <div id="chat-tabs" class="chat-tabs"></div>
          <div id="chat" class="chat"></div>
          <input id="chat-input" class="chat-input" />
        </section>
        <div id="mobile-game-controls" class="mobile-game-controls" aria-hidden="true">
          <div id="mobile-joystick" class="mobile-joystick" aria-label="Movement control">
            <div id="mobile-joystick-knob" class="mobile-joystick-knob"></div>
          </div>
          <div class="mobile-panel-buttons">
            <button class="mobile-panel-button" type="button" data-mobile-panel="stats" data-game-text="stats">Stats</button>
            <button class="mobile-panel-button" type="button" data-mobile-panel="inventory" data-game-text="mobileInventory">Inventory</button>
            <button class="mobile-panel-button" type="button" data-mobile-panel="chat" data-game-text="mobileChat">Chat</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
