name: Deploy Vite game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate online client configuration
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
          VITE_GAME_API_URL: ${{ vars.VITE_GAME_API_URL }}
        run: |
          test -n "$VITE_GAME_SERVER_URL" || (echo "Missing VITE_GAME_SERVER_URL repository variable" && exit 1)
          test -n "$VITE_GAME_API_URL" || (echo "Missing VITE_GAME_API_URL repository variable" && exit 1)

      - name: Validate Tiled world assets
        run: npm run validate:maps

      - name: Build
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
          VITE_GAME_API_URL: ${{ vars.VITE_GAME_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '1068214555365-73nhpu29squg26bdkh74iofbe79q0vm3.apps.googleusercontent.com' }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
